# The two scans that look for what the test suite does not: CodeQL reads the
# source for known-bad code shapes, and pip-audit holds the locked dependency
# set against the public advisory databases. Weekly on top of every push,
# because an advisory can arrive for a tree that did not change; the lift of
# httpx2 and pyjwt on 2026-10-08 is exactly the find this job automates.
name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  reuse:
    name: REUSE licensing lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: reuse lint
        run: uvx --from "reuse[charset-normalizer]" reuse lint

  pip-audit:
    name: pip-audit over the locked set
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The runtime set as the image ships it: --extra documents mirrors the
      # uv sync line of the Dockerfile, and --no-dev keeps dev tools out
      # because an advisory against a tool the release never ships in must
      # not block it; dependabot moves the dev set on its weekly pass anyway.
      - name: Export the locked runtime set
        run: uv export --frozen --format requirements-txt --no-emit-project --no-dev --extra documents -o "${RUNNER_TEMP}/requirements-audit.txt"

      # --disable-pip audits the pinned list as text instead of dry-run
      # installing it; without the flag pip tried to build lxml from source
      # on the runner and the job failed on a missing libxml2, not on an
      # advisory.
      - name: Audit against the advisory databases
        run: uvx pip-audit --strict --disable-pip -r "${RUNNER_TEMP}/requirements-audit.txt"
