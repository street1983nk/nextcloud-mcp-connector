[project]
name = "nextcloud-mcp-connector"
version = "0.7.0"
description = "Curated MCP server for Nextcloud: files, calendar, notes, deck and contacts as read-first tools"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "street1983nk", email = "admin@infranode.dev" }]
keywords = ["mcp", "nextcloud", "webdav", "caldav", "carddav"]

# Dependency policy (see docs/dependency-audit.md):
# httpx2 is a transitive dependency of mcp only. It is never pinned directly here.
# cryptography is listed because oauth/crypto.py imports it directly; it was already in
# the lock through mcp -> pyjwt[crypto], so the entry is a declaration, not an install.
dependencies = [
    "mcp[cli]>=2.0,<3",
    "cryptography>=50,<51",
    # oauth/oidc.py validates ID tokens with PyJWT directly; already locked through mcp.
    "pyjwt[crypto]>=2.14,<3",
    "httpx>=0.28,<0.29",
    "lxml>=6.1,<7",
    "icalendar>=7.2,<8",
    "vobject>=0.9.9,<1",
    "pydantic>=2.12,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
# Office and PDF to Markdown for files_read_as_markdown (TOOL-14). Optional for standalone
# installs; the ExApp image always carries it. All four are MIT or BSD-3 licensed;
# python-pptx pulls in Pillow and XlsxWriter.
documents = [
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "pypdf>=6.19,<7",
]

[project.scripts]
nc-mcp = "mcp_connector.entry_stdio:main"
nc-mcp-exapp = "mcp_connector.entry_exapp:main"
nc-mcp-oauth = "mcp_connector.entry_oauth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is fast and starts nothing: no Docker (the local Linux Docker engine
# is not available) and no server subprocess. Both heavier layers are opt-in via their
# marker, and a command line `-m` overrides this one.
# importlib import mode: unit and integration tests may carry the same file name
# (test_unified_search.py in both layers), which the legacy prepend mode rejects with
# an "import file mismatch" because the test tree has no packages.
addopts = "-m 'not integration and not matrix' -q --import-mode=importlib"
markers = [
    "integration: needs the Docker test Nextcloud (opt-in via -m integration)",
    "matrix: starts local subprocesses without Nextcloud (opt-in via -m matrix)",
]
# The integration directory carries one module that is not a test file,
# `topology.py`, and the importlib mode above does not put a test's own directory on
# the import path. This entry does, and only for that directory: the files there import
# `topology` and nothing else of each other. tests/unit carries exactly one module that is
# not a test file as well, `guard_routes.py`, the mock helpers of the kein-ki guard.
# tests/integration also carries `canary_world.py`, the harness of phase 28, next to
# `topology.py`. tests/contract carries the data modules `tool_classes.py` and
# `result_shapes.py`, which the canary and the pair tests import.
pythonpath = ["tests/integration", "tests/unit", "tests/contract"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff also formats Python blocks inside Markdown. The planning documents contain
# illustrative snippets that must stay verbatim, so they are out of scope for lint
# and format. Everything that ships is covered.
exclude = [".planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF", "PT", "ASYNC", "RET", "A", "ISC"]
# ISC001 clashes with the formatter (implicit string concatenation on one line).
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts (pytest) and throwaway credentials on purpose.
"tests/**" = ["S101", "S105", "S106"]
# The vulture whitelist is parsed by vulture, never imported: bare undefined names are
# its documented format. pyright never sees it, because `include` lists src, scripts
# and tests only.
"vulture_whitelist.py" = ["F821", "B018"]

[tool.pyright]
include = ["src", "scripts", "tests"]
# The legacy client check runs in its own environment with mcp 1.29; checking it
# against the installed mcp 2.x produces false import errors.
exclude = ["tests/compat/legacy_client_check.py"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# The same helper directories pytest puts on the import path (`pythonpath` above), so the
# type checker resolves `result_shapes` from tests/contract in unit and integration tests too.
extraPaths = ["tests/integration", "tests/unit", "tests/contract"]

[tool.ruff.lint.isort]
# Without this, `mcp_connector` is grouped with the third-party `mcp` package,
# because the project is installed into the environment.
known-first-party = ["mcp_connector"]

# The unit and contract suites covered 95 per cent of src/mcp_connector when
# the floor was introduced (2026-10-08); 93 leaves room for refactors and
# still catches a feature that arrives without its tests. Integration tests
# add coverage on top but need a live Nextcloud, so the floor is measured
# where every contributor can run it.
[tool.coverage.report]
fail_under = 93
skip_covered = true

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
    "vulture>=2.16",
]
